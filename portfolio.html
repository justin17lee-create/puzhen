<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio — Puzhen 樸真</title>
  <link rel="stylesheet" href="style.css">
  <script src="nav.js" defer></script>
</head>

<body>

  <section class="portfolio fade-content" id="pageContent">

    <h2>Animation</h2>

    <div class="film-block">
      <p class="film-title">Deep End (2026)</p>

      <p class="film-desc">
        One summer in early-2000s China, a shy preteen girl confronts her fear of water — and human connection — when she forms an unexpected, magical bond in the deep end of the pool.
      </p>
    </div>

<div class="video-wrap">
  <iframe
    src="https://player.vimeo.com/video/1232604446"
    title="Deep End - Film Trailer"
    frameborder="0"
    allow="autoplay; fullscreen; picture-in-picture"
    allowfullscreen>
  </iframe>
</div>


    <!-- Deep End Image Gallery -->

   <div class="image-gallery">

  <div class="gallery-main">

    <img
      id="gallery-main-img"
      src="images/animation7.webp"
      alt="Deep End">

    <button
      class="gallery-arrow gallery-arrow-left"
      id="gallery-prev">
      &#8592;
    </button>

    <button
      class="gallery-arrow gallery-arrow-right"
      id="gallery-next">
      &#8594;
    </button>

  </div>


  <div class="gallery-thumbs">

    <button
      class="gallery-thumb active"
      data-image="images/animation7.webp">
      <img src="images/animation7.webp" alt="Deep End">
    </button>
    
    <button
      class="gallery-thumb"
      data-image="images/animation1.webp">
      <img src="images/animation1.webp" alt="Deep End">
    </button>

    <button
      class="gallery-thumb"
      data-image="images/animation2.webp">
      <img src="images/animation2.webp" alt="Deep End">
    </button>

    <button
      class="gallery-thumb"
      data-image="images/animation3.webp">
      <img src="images/animation3.webp" alt="Deep End">
    </button>

    <button
      class="gallery-thumb"
      data-image="images/animation4.webp">
      <img src="images/animation4.webp" alt="Deep End">
    </button>

    <button
      class="gallery-thumb"
      data-image="images/animation5.webp">
      <img src="images/animation5.webp" alt="Deep End">
    </button>

    <button
      class="gallery-thumb"
      data-image="images/animation6.webp">
      <img src="images/animation6.webp" alt="Deep End">
    </button>

  </div>

    </div>


    <h2>Model Making</h2>

    <div class="model-grid">

      <img src="images/model1.webp" alt="">
      <img src="images/model2.webp" alt="">
      <img src="images/model3.webp" alt="">
      <img src="images/model4.webp" alt="">
      <img src="images/model5.webp" alt="">
      <img src="images/model6.webp" alt="">
      <img src="images/model7.webp" alt="">
      <img src="images/model8.webp" alt="">
      <img src="images/model9.webp" alt="">
      <img src="images/model10.webp" alt="">
      <img src="images/model11.webp" alt="">
      <img src="images/model12.webp" alt="">

    </div>

  </section>


  <!-- Lightbox -->

  <div class="lightbox" id="lightbox">

    <!-- 电脑端左右箭头 -->

    <button
      class="lb-btn lb-prev desktop-only"
      id="lbPrev">&#8592;</button>

    <img id="lightbox-img" alt="">

    <button
      class="lb-btn lb-next desktop-only"
      id="lbNext">&#8594;</button>


    <!-- 手机端底部箭头 -->

    <div class="lb-mobile-controls">

      <button
        class="lb-btn-mobile"
        id="lbPrevMobile">&#8592;</button>

      <button
        class="lb-btn-mobile"
        id="lbNextMobile">&#8594;</button>

    </div>

  </div>


  <script>

    /* =========================
       Page Fade In
    ========================= */

    window.addEventListener('load', function () {

      setTimeout(function () {

        document
          .getElementById('pageContent')
          .classList.add('visible');

      }, 100);

    });


    /* =========================
       Deep End Gallery
    ========================= */

    const galleryMainImg =
      document.getElementById("gallery-main-img");

    const galleryThumbs =
      Array.from(
        document.querySelectorAll(".gallery-thumb")
      );

    const galleryPrev =
      document.getElementById("gallery-prev");

    const galleryNext =
      document.getElementById("gallery-next");

    let currentGalleryIndex = 0;


    function showGalleryImage(index) {

      if (index < 0) {

        index = galleryThumbs.length - 1;

      }

      if (index >= galleryThumbs.length) {

        index = 0;

      }

      const thumb =
        galleryThumbs[index];

      const newImage =
        thumb.dataset.image;


      galleryMainImg.style.opacity = "0";


      setTimeout(() => {

        galleryMainImg.src = newImage;

        galleryMainImg.style.opacity = "1";

      }, 150);


      galleryThumbs.forEach(item => {

        item.classList.remove("active");

      });


      thumb.classList.add("active");

      currentGalleryIndex = index;

    }


    galleryThumbs.forEach((thumb, index) => {

      thumb.addEventListener("click", function (e) {

        e.preventDefault();

        showGalleryImage(index);

      });

    });


    galleryPrev.addEventListener("click", function (e) {

      e.preventDefault();

      e.stopPropagation();

      showGalleryImage(
        currentGalleryIndex - 1
      );

    });


    galleryNext.addEventListener("click", function (e) {

      e.preventDefault();

      e.stopPropagation();

      showGalleryImage(
        currentGalleryIndex + 1
      );

    });


    /* =========================
       Lightbox
    ========================= */

    const deepEndImages = [
      'images/animation7.webp',
      'images/animation1.webp',
      'images/animation2.webp',
      'images/animation3.webp',
      'images/animation4.webp',
      'images/animation5.webp',
      'images/animation6.webp'
    ];


    const modelImages = Array.from(
      document.querySelectorAll('.model-grid img')
    ).map(img => img.src);


    const lightbox =
      document.getElementById('lightbox');

    const lightboxImg =
      document.getElementById('lightbox-img');

    const lbPrev =
      document.getElementById('lbPrev');

    const lbNext =
      document.getElementById('lbNext');

    const lbPrevMobile =
      document.getElementById('lbPrevMobile');

    const lbNextMobile =
      document.getElementById('lbNextMobile');


    let currentLightboxImages = [];
    let currentIndex = 0;


    function openLightbox(images, index) {

      currentLightboxImages = images;

      currentIndex = index;

      lightboxImg.src =
        currentLightboxImages[currentIndex];

      lightbox.style.display = 'flex';

      requestAnimationFrame(() => {

        requestAnimationFrame(() => {

          lightbox.classList.add('open');

        });

      });

    }


    function closeLightbox() {

      lightbox.classList.remove('open');

      setTimeout(() => {

        lightbox.style.display = 'none';

      }, 300);

    }


    function switchImage(newIndex) {

      lightboxImg.style.opacity = '0';

      lightboxImg.style.transform =
        'scale(0.97)';


      setTimeout(() => {

        currentIndex = newIndex;

        lightboxImg.src =
          currentLightboxImages[currentIndex];

        lightboxImg.style.opacity = '1';

        lightboxImg.style.transform =
          'scale(1)';

      }, 200);

    }


    function showPrev() {

      switchImage(
        (currentIndex - 1 + currentLightboxImages.length)
        % currentLightboxImages.length
      );

    }


    function showNext() {

      switchImage(
        (currentIndex + 1)
        % currentLightboxImages.length
      );

    }


    /* 点击 Deep End 大图 */

    galleryMainImg.addEventListener('click', () => {

      openLightbox(
        deepEndImages,
        currentGalleryIndex
      );

    });


    /* 点击 Model Making 图片 */

    document
      .querySelectorAll('.model-grid img')
      .forEach((img, index) => {

        img.addEventListener('click', () => {

          openLightbox(
            modelImages,
            index
          );

        });

      });


    /* 点击 Lightbox 背景关闭 */

    lightbox.addEventListener('click', (e) => {

      if (e.target === lightbox) {

        closeLightbox();

      }

    });


    /* 电脑端左右按钮 */

    lbPrev.addEventListener('click', (e) => {

      e.stopPropagation();

      showPrev();

    });


    lbNext.addEventListener('click', (e) => {

      e.stopPropagation();

      showNext();

    });


    /* 手机端左右按钮 */

    lbPrevMobile.addEventListener('click', (e) => {

      e.stopPropagation();

      showPrev();

    });


    lbNextMobile.addEventListener('click', (e) => {

      e.stopPropagation();

      showNext();

    });


    /* 键盘 */

   document.addEventListener('keydown', (e) => {

  /* Lightbox 打开时 */
  if (lightbox.style.display === 'flex') {

    if (e.key === 'ArrowLeft') {
      showPrev();
    }

    if (e.key === 'ArrowRight') {
      showNext();
    }

    if (e.key === 'Escape') {
      closeLightbox();
    }

    return;
  }


  /* Gallery 缩略图 */
  if (e.key === 'ArrowUp') {

    e.preventDefault();

    showGalleryImage(
      currentGalleryIndex - 1
    );

  }

  if (e.key === 'ArrowDown') {

    e.preventDefault();

    showGalleryImage(
      currentGalleryIndex + 1
    );

  }

});

  </script>

</body>
</html>
